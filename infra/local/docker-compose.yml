# 로컬 개발용 DB(Postgres 17)와 사진 저장소(RustFS, S3 호환). DB의 주인이 BE라 BE 레포에 둔다 (예전엔 FE 레포에 있었다).
# 보통은 직접 켤 필요 없다: BE `./gradlew bootRun`이나 FE `npm run dev`가 이 파일로 알아서 켠다.
# 직접 켜기: docker compose up -d --wait / 끄기: docker compose down (데이터는 볼륨에 남음)  — 이 폴더(infra/local)에서 실행
# 테이블은 BE가 기동할 때 Flyway로 만든다 (src/main/resources/db/migration).
# 이름을 고정해서 폴더 위치가 달라도(FE 레포에서 옮겨 옴, git worktree) 같은 DB 컨테이너·데이터를 쓴다 — 바꾸지 말 것
name: travelpass-backoffice
services:
  db:
    image: postgres:17
    labels:
      # BE bootRun이 이 컨테이너로 접속 정보를 덮어쓰지 않게 (application.yml datasource의 stringtype=unspecified 등을 유지)
      org.springframework.boot.ignore: 'true'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelpass
    ports:
      - '5433:5432' # 다른 로컬 Postgres와 겹치지 않게 5433
    volumes:
      - db-data:/var/lib/postgresql/data
    # 접속 가능해질 때까지 기다리게 (npm run dev가 docker compose up --wait로 씀)
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d travelpass']
      interval: 2s
      timeout: 3s
      retries: 15

  # 상품 사진 저장소 (RustFS, S3 호환). MinIO 이미지는 2026-10 기준 Docker Hub·quay.io에서 받을 수 없어 RustFS를 쓴다. 배포에서 쓰는 Supabase Storage·NCP Object Storage·AWS S3와 같은 프로토콜.
  # 콘솔: http://localhost:9001 (rustfsadmin / rustfsadmin). 버킷은 BE 가 첫 업로드 때 만든다 (storage/ObjectStorage)
  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_ACCESS_KEY: rustfsadmin # 로컬 전용
      RUSTFS_SECRET_KEY: rustfsadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - storage-data:/data

volumes:
  db-data:
  storage-data:

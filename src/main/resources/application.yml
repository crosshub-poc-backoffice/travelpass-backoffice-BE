server:
  port: 8081
  error:
    # 에러 메시지·스택트레이스·예외 클래스는 응답에 노출하지 않는다 (서버 로그로만 확인).
    # 메시지를 always로 두면 500일 때 SQL·컬럼명·enum 이름이 응답에 나간다. FE가 쓰는 건 상태코드와 {code} 본문뿐
    include-message: never
    include-exception: false
    include-stacktrace: never

spring:
  application:
    name: poc-backoffice-be
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:travelpass}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  # ./gradlew bootRun 때 로컬 DB·사진 저장소 컨테이너를 켠다 (이미 켜져 있으면 그대로, BE를 꺼도 컨테이너는 유지).
  # 접속 정보는 위 datasource(.env)를 그대로 쓴다 — compose 쪽 db에 org.springframework.boot.ignore 라벨
  # 원격 DB로 띄울 때는 .env에 DOCKER_COMPOSE_ENABLED=false
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
      file: infra/local/docker-compose.yml
      lifecycle-management: start-only
  # 테이블 구조의 주인은 BE(Flyway). docs/db-ownership-plan.md
  # 이미 Prisma로 만든 DB는 V1을 실행하지 않고 baseline으로 표시만 한다 (db/migration/beforeMigrate.sql이 먼저 확인)
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: prisma 56 migrations
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # dev 모드: 토큰 없이 전부 허용. 기본은 꺼짐(fail-closed) — 로컬에서만 .env의 APP_DEV_ENABLED=true로 켠다.
  dev:
    enabled: ${APP_DEV_ENABLED:false}
    # 특정 계정으로 로그인한 것처럼 보고 싶으면 그 User.loginId 지정. 비우면 전체 열람 crosshub 가짜 사용자.
    login-id: ${APP_DEV_LOGIN_ID:}
  # 계정 발급·초기화·토글용 Keycloak Admin API (backoffice-admin-api service account). secret은 BE에만 둔다
  keycloak:
    # 신뢰하는 issuer(realm) 두 개 — 토큰 iss 와 정확히 같아야 한다 (FE의 KEYCLOAK_ISSUER_URI 와 같은 값)
    staff-issuer: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/crosshub}
    # 고객 realm. 비우면 고객용 API 는 전부 401
    customer-issuer: ${KEYCLOAK_CUSTOMER_ISSUER_URI:http://localhost:8080/realms/idblock}
    # role 을 붙일 BE 이름표 client (토큰 aud·resource_access 키와 같은 값)
    app-client-id: ${KEYCLOAK_APP_CLIENT_ID:backoffice-api}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:backoffice-admin-api}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}

logging:
  level:
    com.crosshub.backoffice: DEBUG

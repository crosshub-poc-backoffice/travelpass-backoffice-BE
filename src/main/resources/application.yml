server:
  port: 8081
  error:
    # 에러 메시지·스택트레이스·예외 클래스는 응답에 노출하지 않는다 (서버 로그로만 확인).
    # 메시지를 always로 두면 500일 때 SQL·컬럼명·enum 이름이 응답에 나간다. FE가 쓰는 건 상태코드와 {code} 본문뿐
    include-message: never
    include-exception: false
    include-stacktrace: never

spring:
  application:
    name: travelpass-backoffice-be
  # 설정 값은 전부 환경변수로 받는다 (로컬은 .env, 운영은 서버 환경변수 — 같은 이름이면 환경변수가 이긴다).
  # 코드에 기본값을 두지 않는다 — 빠진 값이 있으면 시작할 때 전부 알려주고 멈춘다 (config/RequiredEnv). 목록은 .env.example
  # 예외는 실행 방식이 정하는 셋: DOCKER_COMPOSE_ENABLED·APP_AUTH_DEV_LOGIN_ID·KEYCLOAK_INTERNAL_URL
  config:
    import: optional:file:.env[.properties]
  # 파일 업로드 상한. 종류별 상한(사진 5MB·사업자등록증 10MB·소개서 50MB)은 storage/FileTypes 가 다시 본다
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?stringtype=unspecified
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # ./gradlew bootRun 때 로컬 DB·사진 저장소 컨테이너를 켠다 (이미 켜져 있으면 그대로, BE를 꺼도 컨테이너는 유지).
  # 접속 정보는 위 datasource(.env)를 그대로 쓴다 — compose 쪽 db에 org.springframework.boot.ignore 라벨
  # 원격 DB로 띄울 때는 .env에 DOCKER_COMPOSE_ENABLED=false (로컬 개발 도구 스위치라 기본값 true 를 둔다 — 배포 jar 에는 이 기능이 없다)
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:true}
      file: infra/local/docker-compose.yml
      lifecycle-management: start-only
  # 테이블 구조의 주인은 BE(Flyway). docs/db-ownership-plan.md
  # 이미 Prisma로 만든 DB는 V1을 실행하지 않고 baseline으로 표시만 한다 (db/migration/beforeMigrate.sql이 먼저 확인)
  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: prisma 56 migrations
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  # 인증 끄기: 토큰 없이 전부 허용. 로컬에서만 .env의 APP_AUTH_DISABLED=true로 켠다 (secure 프로필은 무조건 false).
  auth:
    disabled: ${APP_AUTH_DISABLED}
    # 인증을 껐을 때만 쓴다: 로그인한 것으로 칠 User.loginId. 비우면 전체 열람 crosshub 가짜 사용자.
    dev-login-id: ${APP_AUTH_DEV_LOGIN_ID:}
  # 계정 발급·초기화·토글용 Keycloak Admin API (tp-office-partner-svc service account). secret은 BE에만 둔다
  keycloak:
    # 신뢰하는 issuer(realm) 두 개 — 토큰 iss 와 정확히 같아야 한다 (FE의 KEYCLOAK_STAFF_ISSUER_URI 와 같은 값)
    staff-issuer: ${KEYCLOAK_STAFF_ISSUER_URI}
    # 고객 realm. 빈 값이면 고객용 API 는 전부 401
    customer-issuer: ${KEYCLOAK_CUSTOMER_ISSUER_URI}
    # role 을 붙일 BE 이름표 client (토큰 aud·resource_access 키와 같은 값)
    audience: ${KEYCLOAK_AUDIENCE}
    svc-client-id: ${KEYCLOAK_SVC_CLIENT_ID}
    svc-client-secret: ${KEYCLOAK_SVC_CLIENT_SECRET}
    # BE 가 Keycloak 에 직접 접속할 주소(scheme://host:port). iss 검사는 issuer 그대로 (config/KeycloakUrls)
    # BE 를 컨테이너로 띄울 때만 compose.yaml 이 http://host.docker.internal:8080 을 넣는다. 그 외(bootRun·운영)엔 없음 → issuer 주소로 접속
    # .env 에 적는 값이 아니라서 빈 기본값을 둔다 (DOCKER_COMPOSE_ENABLED 처럼 실행 방식이 정하는 값)
    internal-url: ${KEYCLOAK_INTERNAL_URL:}
  # 상품 번역·AI 검수 (Upstage Solar). 키는 BE 에만 둔다. 키가 빈 값이면 AI 검수는 건너뛰고, 번역은 fake-when-missing 에 따라
  # "[언어] 원문" 가짜 값(로컬 개발) 또는 실패. fake-when-missing=false 인데 키가 비어 있으면 시작하지 않는다
  upstage:
    api-key: ${UPSTAGE_API_KEY}
    fake-when-missing: ${UPSTAGE_FAKE_WHEN_MISSING}
    # 상품 소개서 → 등록 화면 초안(Universal Extraction) 전용 키. 빈 값이면 api-key 를 같이 쓴다
    # 번역은 토큰 과금, 문서는 페이지 과금이라 키를 나누면 어느 쪽이 크레딧을 썼는지 구분된다
    docs-api-key: ${UPSTAGE_DOCS_API_KEY}
    # Solar 호출 최소 간격(ms). 실제 호출 제한을 확인하면 조정 (지금은 한 번에 하나씩만 보낸다)
    min-interval-ms: ${SOLAR_MIN_INTERVAL_MS}

  # 상품 사진·사업자등록증·상품 소개서 저장소 (S3 프로토콜). 로컬은 RustFS (infra/local/docker-compose.yml)
  # DB 에는 저장소 안 경로(key)만 넣고 응답에서 public-url 을 붙인다 — 저장소·CDN 을 옮기면 public-url 만 바꾼다
  # Supabase: endpoint=https://xxxx.supabase.co/storage/v1/s3, public-url=https://xxxx.supabase.co/storage/v1/object/public/<bucket>
  # NCP: endpoint=https://kr.object.ncloudstorage.com, region=kr-standard
  storage:
    endpoint: ${S3_ENDPOINT}
    region: ${S3_REGION}
    bucket: ${S3_BUCKET}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    public-url: ${S3_PUBLIC_URL}

logging:
  level:
    com.crosshub.backoffice: DEBUG

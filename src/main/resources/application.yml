server:
  port: 8081
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always

spring:
  application:
    name: poc-backoffice-be
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?stringtype=unspecified
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  # dev 모드: 토큰 없이 전부 허용. Keycloak 붙이면 secure 프로파일로 끈다.
  dev:
    enabled: ${APP_DEV_ENABLED:true}
    # 특정 계정으로 로그인한 것처럼 보고 싶으면 그 User.loginId 지정. 비우면 전체 열람 crosshub 가짜 사용자.
    login-id: ${APP_DEV_LOGIN_ID:}

logging:
  level:
    com.crosshub.backoffice: DEBUG

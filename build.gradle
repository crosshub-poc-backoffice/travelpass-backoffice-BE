plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.crosshub'
version = '0.0.1-SNAPSHOT'

java {
    // Spring Boot 3 최소 요건은 17. 로컬 JDK가 17 이상이면 그대로 빌드된다.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 테이블 구조는 BE가 관리한다 (src/main/resources/db/migration). 버전은 Spring Boot가 맞춘다
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    // 상품 사진·사업자등록증·상품 소개서 저장 (S3 프로토콜 — 로컬 RustFS·Supabase·NCP·AWS 모두 같은 코드)
    implementation platform('software.amazon.awssdk:bom:2.29.52')
    implementation('software.amazon.awssdk:s3') {
        exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
        exclude group: 'software.amazon.awssdk', module: 'apache-client'
    }
    implementation 'software.amazon.awssdk:url-connection-client'
    // ./gradlew bootRun 때 compose.yaml(로컬 DB·사진 저장소)을 자동으로 켠다. 배포 jar에는 안 들어간다
    developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
